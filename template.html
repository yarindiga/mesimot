<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>לוח הפולו־אפ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Assistant:wght@400;500;600;700&display=swap');

:root{
  --paper:#f2f4f7;
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --hover:#eef2f7;
  --ink:#1b2330;
  --ink-2:#48566a;
  --muted:#7a8798;
  --line:#e4e8ee;
  --line-strong:#cbd2dc;
  --accent:#0f62d6;
  --accent-soft:#e7f0ff;
  --signal:#c0392b;
  --signal-soft:#fdecea;
  --ok:#0f8a52;
  --ok-soft:#e6f6ee;
  --warn:#b3730c;
  --on-accent:#ffffff;
  --shadow-1:0 1px 2px rgba(20,28,40,.05);
  --shadow-2:0 6px 24px rgba(20,28,40,.10);
  --font-display:'Frank Ruhl Libre','Times New Roman',serif;
  --font-body:'Assistant','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:10px;
  --maxw:880px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1117;
    --surface:#161c25;
    --surface-2:#1c2430;
    --hover:#212b38;
    --ink:#e8edf4;
    --ink-2:#bcc8d6;
    --muted:#8695a7;
    --line:#28323f;
    --line-strong:#3a4655;
    --accent:#6aabff;
    --accent-soft:#132840;
    --signal:#f08a76;
    --signal-soft:#3a1e18;
    --ok:#5cc794;
    --ok-soft:#122e22;
    --warn:#e0a94a;
    --on-accent:#0d1117;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#0d1117; --surface:#161c25; --surface-2:#1c2430; --hover:#212b38;
  --ink:#e8edf4; --ink-2:#bcc8d6; --muted:#8695a7; --line:#28323f; --line-strong:#3a4655;
  --accent:#6aabff; --accent-soft:#132840; --signal:#f08a76; --signal-soft:#3a1e18;
  --ok:#5cc794; --ok-soft:#122e22; --warn:#e0a94a; --on-accent:#0d1117;
  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 6px 24px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.5;
  direction:rtl;text-align:right;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============ כניסה ============ */
.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px 18px}
.gate-card{
  width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:32px 28px 26px;box-shadow:var(--shadow-2);
}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.015em}
.brand .tick{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-5px)}
.gate-sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{
  width:100%;padding:11px 13px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r);transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.remember{display:flex;align-items:center;gap:9px;margin:4px 0 18px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.remember input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.btn{
  width:100%;padding:12px;background:var(--accent);color:var(--on-accent);border:0;
  border-radius:var(--r);font-weight:700;font-size:15.5px;cursor:pointer;transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:progress}
.gate-msg{min-height:20px;margin-top:12px;font-size:13.5px;color:var(--signal);font-weight:600}
.gate-note{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* ============ מעטפת ============ */
.app{max-width:var(--maxw);margin:0 auto;padding:0 14px 72px}

.topline{
  display:flex;align-items:center;gap:12px;
  padding:16px 2px 0;font-size:13px;color:var(--muted);
}
.topline .mark{
  font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ink);
  letter-spacing:-.01em;flex:1;
}
.linkbtn{
  background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;
  cursor:pointer;padding:5px 7px;border-radius:7px;
}
.linkbtn:hover{background:var(--accent-soft)}
.who{white-space:nowrap}

/* ---- כותרת ראשית ---- */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-top:12px;box-shadow:var(--shadow-1);
}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.hero h2{
  font-family:var(--font-display);font-weight:700;font-size:23px;margin:2px 0 0;
  letter-spacing:-.015em;text-wrap:balance;
}
.hero-row{display:flex;align-items:flex-start;gap:14px}
.hero-row > div:first-child{flex:1;min-width:0}
.ring{flex:none;width:56px;height:56px;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;
}
.stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.stat{
  display:inline-flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--muted);
}
.stat b{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.stat.done b{color:var(--ok)}
.synced{margin-top:11px;font-size:11.5px;color:var(--muted)}

/* ---- פקדים דביקים ---- */
.sticky{
  position:sticky;top:0;z-index:40;margin-top:14px;padding:10px 0;
  background:linear-gradient(var(--paper) 72%, transparent);
}
.search{
  width:100%;padding:10px 14px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .15s;
}
.search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.bar{display:flex;gap:6px;overflow-x:auto;padding:9px 2px 2px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.pill{
  flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;
  font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill[aria-pressed="true"]:hover{color:var(--on-accent)}
.pill[aria-pressed="true"] .n{color:var(--on-accent);opacity:.78}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:8px 2px 0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seglabel{font-size:12px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.statusline{display:none}

.resumed{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);
  padding:10px 14px;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow-1);
}
.resumed b{color:var(--ink)}
.resumed button{
  margin-inline-start:auto;background:var(--accent);color:var(--on-accent);border:0;
  border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
}
.viewing{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r);
  padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--accent);
}
.viewing button{
  margin-inline-start:auto;background:var(--accent);color:var(--on-accent);border:0;
  border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
}

/* ============ קבוצות ושורות ============ */
.group{margin-top:22px}
.ghead{
  position:sticky;top:52px;z-index:20;
  display:flex;align-items:center;gap:8px;padding:5px 2px;margin-bottom:7px;
  font-size:12.5px;font-weight:700;background:var(--paper);
}
.ghead .dot{width:9px;height:9px;border-radius:3px;background:var(--gc);flex:none}
.ghead .gname{color:var(--gc-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ghead .gname{color:var(--gc-d)}}
:root[data-theme="dark"] .ghead .gname{color:var(--gc-d)}
.ghead .gn{color:var(--muted);font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums}
.ghead::after{content:"";flex:1;height:1px;background:var(--line)}

.rows{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-1);
}
.row{
  position:relative;display:flex;align-items:flex-start;gap:11px;
  padding:11px 14px 11px 12px;border-top:1px solid var(--line);cursor:pointer;
  transition:background .12s;
}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--gc)}
.row:hover,.row.open{background:var(--hover)}

/* עיגול הסימון — יעד מגע אמיתי, בתחילת השורה */
.st{
  flex:none;margin-top:1px;width:26px;height:26px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:2px solid var(--line-strong);background:transparent;color:transparent;
  border-radius:50%;cursor:pointer;font-size:14px;font-weight:700;line-height:1;
  transition:border-color .15s,background .15s,color .15s,transform .12s;
}
.st::after{
  content:"";position:absolute;inset-block:2px;inset-inline-start:2px;width:44px;
}
.st:hover{border-color:var(--accent)}
.st:active{transform:scale(.9)}
.st.working{border-color:#fdab3d;background:#fdab3d;color:#1d2129}
.st.done{border-color:#00c875;background:#00c875;color:#0d2b1c}
.st.saving{opacity:.5;cursor:progress}

.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.addr{
  font-weight:600;font-size:15.5px;letter-spacing:-.005em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
}
.city{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
.chip{
  flex:none;font-size:11px;font-weight:600;padding:2px 9px;border-radius:5px;
  background:var(--line);color:var(--ink-2);white-space:nowrap;line-height:1.55;
}
.date{
  flex:none;margin-inline-start:auto;font-size:11.5px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);
}
.rprev{
  font-size:12.5px;line-height:1.45;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row.open .rprev{display:none}
.caret,.brk{display:none}

@media (hover:hover) and (pointer:fine) and (min-width:701px){
  .row:hover:not(.open) .pop{visibility:visible}
  .rprev{display:none}
}
.pop{
  position:absolute;top:calc(100% - 2px);inset-inline:12px;z-index:30;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);
  box-shadow:var(--shadow-2);padding:11px 14px;font-size:13.5px;line-height:1.5;color:var(--ink-2);
  white-space:pre-wrap;overflow:hidden;text-align:right;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;
  visibility:hidden;pointer-events:none;
}

.detail{display:none;padding:0 24px 15px 46px;background:var(--hover);border-top:1px solid var(--line)}
.row.open + .detail{display:block}
.detail .task-desc{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-size:14.5px}
.detail .bgsec{margin-top:14px}
.detail .bgsec h4{margin:0 0 5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.detail .bgsec p{
  margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.6;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  max-height:280px;overflow-y:auto;
}
.detail .bgsec a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

/* ============ בחירת סטטוס ============ */
.stpop.up{top:auto;bottom:calc(100% - 2px)}
.stpop{
  position:absolute;top:calc(100% - 2px);inset-inline-end:10px;z-index:60;width:min(300px,90vw);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
  box-shadow:var(--shadow-2);padding:14px;text-align:right;cursor:default;
}
.stpop h5{margin:0 0 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stpop .picks{display:flex;gap:8px;margin-bottom:10px}
.stpop .picks button{
  flex:1;border:1px solid transparent;border-radius:10px;
  padding:12px 6px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s,filter .15s;
}
.stpop .picks button:hover{filter:brightness(.96)}
.stpop .picks button:active{transform:scale(.97)}
.stpop .picks .w{background:#fdab3d;color:#1d2129}
.stpop .picks .d{background:#00c875;color:#10241a}
.stpop textarea{
  width:100%;min-height:54px;resize:vertical;padding:9px 11px;font-size:13.5px;
  border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);color:var(--ink);
}
.stpop textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.stpop .foot2{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.stpop .clear{background:none;border:0;color:var(--signal);font-size:12.5px;font-weight:600;cursor:pointer;padding:5px}
.stpop .close{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;padding:5px}

@media (max-width:700px){
  .stpop, .stpop.up{
    position:fixed;inset-inline:0;bottom:0;top:auto;width:auto;
    border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 34px rgba(0,0,0,.28);
    animation:sheet .22s cubic-bezier(.2,.7,.3,1);
  }
  .stpop h5{font-size:14px;color:var(--ink)}
  .stpop .picks button{padding:16px 8px;font-size:15.5px;border-radius:12px}
  .stpop textarea{min-height:64px;font-size:15px}
  .stpop .clear,.stpop .close{padding:9px 6px;font-size:13.5px}
}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sheetbg{
  position:fixed;inset:0;z-index:55;background:rgba(12,18,28,.42);
  animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

.toast{
  position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom));
  margin:0 auto;width:max-content;max-width:90vw;z-index:90;
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);
  opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}
.toast.bad{background:var(--signal);color:#fff}

/* ============ עדכונים ============ */
.utools{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ulist{display:flex;flex-direction:column;gap:8px}
.uday{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin:16px 2px 3px}
.uitem{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 14px;box-shadow:var(--shadow-1);
}
.uitem .uwho{font-weight:700;font-size:13.5px;flex:none}
.uitem .uaddr{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uitem .utime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.uitem .unote{flex-basis:100%;font-size:13px;color:var(--ink-2);white-space:pre-wrap;margin-top:3px}
.badge{
  display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent);
  color:var(--on-accent);font-size:11px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;
}

.empty{
  text-align:center;padding:52px 22px;color:var(--muted);
  border:1px dashed var(--line-strong);border-radius:14px;margin-top:20px;background:var(--surface-2);
}
.empty strong{display:block;font-family:var(--font-display);font-size:21px;color:var(--ink-2);margin-bottom:6px}
.empty .big{font-size:30px;display:block;margin-bottom:8px;color:var(--ok)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}

@media (max-width:520px){
  .app{padding:0 10px 64px}
  .hero{padding:14px 15px;border-radius:12px}
  .hero h2{font-size:20px}
  .ring{width:50px;height:50px}
  .row{padding:10px 13px 10px 10px}
  .ghead{top:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="loginForm" autocomplete="on">
    <div class="brand"><span class="tick"></span><h1>לוח הפולו־אפ</h1></div>
    <p class="gate-sub">משימות הפולו־אפ שלך, ישירות מהלוח.</p>
    <label class="field">
      <span>אימייל</span>
      <input type="email" id="email" autocomplete="username" inputmode="email" dir="ltr" required>
    </label>
    <label class="field">
      <span>סיסמה</span>
      <input type="password" id="pass" autocomplete="current-password" dir="ltr" required>
    </label>
    <label class="remember"><input type="checkbox" id="remember" checked> זכור אותי במכשיר הזה</label>
    <button class="btn" id="loginBtn" type="submit">כניסה</button>
    <div class="gate-msg" id="gateMsg" role="status" aria-live="polite"></div>
    <p class="gate-note">התצוגה היא לקריאה בלבד. עדכון משימות נעשה במאנדיי.</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <div class="topline">
    <span class="mark">לוח הפולו־אפ</span>
    <span class="who" id="who"></span>
    <button class="linkbtn" id="toUpdates" type="button" hidden>עדכונים <span class="badge" id="uBadge">0</span></button>
    <button class="linkbtn" id="toTasks" type="button" hidden>← למשימות</button>
    <button class="linkbtn" id="logout" type="button">יציאה</button>
  </div>

  <section class="hero">
    <div class="hero-row">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h2 id="viewTitle">המשימות שלי</h2>
      </div>
      <div class="ring" id="ring" hidden></div>
    </div>
    <div class="stats" id="stats"></div>
    <p class="synced" id="synced"></p>
  </section>

  <div class="resumed" id="resumed" hidden></div>
  <div class="viewing" id="viewing" hidden></div>

  <div class="sticky">
    <input class="search" id="search" type="search" placeholder="חיפוש בכתובת, במשימה או ברקע…" aria-label="חיפוש">
    <div class="bar" id="adminbar" hidden></div>
    <div class="filters" id="filters" hidden></div>
    <div class="opts">
      <span class="seglabel">מיון</span>
      <div class="seg" role="group" aria-label="מיון">
        <button type="button" id="sortBoard" aria-pressed="true">סדר הלוח</button>
        <button type="button" id="sortType" aria-pressed="false">סוג משימה</button>
      </div>
      <label class="toggle" id="futureWrap" hidden><input type="checkbox" id="future"> כולל עתידיות</label>
    </div>
  </div>

  <div class="statusline" id="statusline"></div>
  <div id="content"></div>
  <div id="updatesView" hidden></div>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="bundle" type="application/json">__PAYLOAD__</script>
<script>
(function(){
  "use strict";
  document.documentElement.lang = "he";
  document.documentElement.dir  = "rtl";

  var DATA = JSON.parse(document.getElementById("bundle").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var STORE_KEY = "tb.remember";
  var NO_TYPE = "ללא סוג";
  var GREY = { bg:"#c4c4c4", light:"#5b6b7a", dark:"#8698a7", ord:999 };

  /* ---------- הצפנה ---------- */
  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(bytes){
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  async function kek(password, saltB64, iters){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(saltB64), iterations:iters, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  }
  async function unseal(key, box){
    return new Uint8Array(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(box.iv) }, key, b64(box.ct)));
  }
  async function rawToKey(bytes){
    return crypto.subtle.importKey("raw", bytes, "AES-GCM", false, ["decrypt"]);
  }
  async function unsealJSON(key, box){
    // הריפוד שמסתיר את גודל המידע נחתך לפני הפענוח
    return JSON.parse(new TextDecoder().decode(await unseal(key, box)).replace(/[\s\0]+$/, ""));
  }

  async function uid(email){
    var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(DATA.siteSalt + ":" + email));
    var b = new Uint8Array(h), out = "";
    for (var i = 0; i < b.length; i++) out += b[i].toString(16).padStart(2, "0");
    return out.slice(0, 32);
  }

  /* ---------- תאריכים ---------- */
  var TODAY = new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Jerusalem", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
  function delta(iso){ return Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(TODAY + "T00:00:00Z")) / 86400000); }
  function short(iso){ var p = iso.split("-"); return (+p[2]) + "." + (+p[1]); }

  /* ---------- טקסט ---------- */
  function oneLine(s){ return s.replace(/\s*\n+\s*/g, " · ").trim(); }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; });
  }
  var RE_PHONE = /\b0\d{1,2}[-‑ ]?\d{3}[-‑ ]?\d{4}\b/g;
  var RE_MAIL  = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g;
  function richText(s){
    var out = esc(s).replace(RE_MAIL, function(m){ return '<a href="mailto:' + m + '" dir="ltr">' + m + "</a>"; });
    return out.replace(RE_PHONE, function(m){
      return /@/.test(m) ? m : '<a href="tel:' + m.replace(/\D/g, "") + '" dir="ltr">' + m + "</a>";
    });
  }

  /* ---------- מצב ---------- */
  var session = null, active = null, query = "", showFuture = false, sortMode = "board";
  var autoResumed = false;
  var statusFilter = "all";
  var marks = {};        // taskId -> {status, note, byName, at}
  var statusOn = false;  // נדלק רק כשצד השרת עונה — עד אז אין כפתורי סימון
  var view  = "tasks";
  var API   = "/api/updates";
  var MARKS_CACHE = "tb.marks";
  var clearedAt = 0;     // מנהל בלבד: חותם הזמן של "ניקוי" אחרון במסך העדכונים
  var history = [];      // מנהל בלבד: כל העדכונים שנרשמו אי פעם, גם אחרי ניקוי
  var updatesSub = "active"; // "active" | "history"

  /* ---------- כניסה ---------- */
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    signIn($("email").value.trim().toLowerCase(), $("pass").value, $("remember").checked);
  });

  var BAD = "אימייל או סיסמה שגויים.";

  async function signIn(email, password, remember){
    var msg = $("gateMsg"), btn = $("loginBtn");
    msg.textContent = "";
    if (!window.crypto || !crypto.subtle){
      msg.textContent = "הדפדפן חוסם פענוח מאובטח. נסו דפדפן אחר.";
      return;
    }

    btn.disabled = true; btn.textContent = "מאמת…";
    try {
      var rec = DATA.records[await uid(email)];
      // אימייל לא מוכר עובר את אותה עבודת גזירה, כדי שזמן התגובה לא יסגיר מי קיים
      var probe = rec || { salt: DATA.decoySalt, keys: [] };
      var wrap  = await kek(password, probe.salt, DATA.iter);

      var raws = [];
      for (var i = 0; i < probe.keys.length; i++){
        try { raws.push({ of: probe.keys[i].of, raw: await unseal(wrap, probe.keys[i].wrapped) }); }
        catch (_){ /* מפתח של מישהו אחר או דמה — מדלגים */ }
      }
      if (!raws.length) throw new Error("no keys");

      autoResumed = false;
      await start(raws);
      if (remember) remember_(raws); else forget();
    } catch (err){
      msg.textContent = BAD;
    } finally {
      btn.disabled = false; btn.textContent = "כניסה";
    }
  }

  function remember_(raws){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        keys: raws.map(function(r){ return { of: r.of, k: toB64(r.raw) }; })
      }));
    } catch (_){}
  }
  function forget(){ try { localStorage.removeItem(STORE_KEY); } catch (_){} }

  async function start(raws){
    var sets = {}, order = [], me = null;
    for (var i = 0; i < raws.length; i++){
      var id = raws[i].of;
      if (!DATA.blobs[id]) continue;
      var body = await unsealJSON(await rawToKey(raws[i].raw), DATA.blobs[id]);
      sets[id] = body; order.push(id);
      if (body.admin) me = id;
    }
    if (!order.length) throw new Error("no data");
    if (!me) me = order[0];
    order.sort(function(a, b){ return (a === me ? -1 : 0) - (b === me ? -1 : 0); });

    session = { meId: me, isAdmin: !!sets[me].admin, sets: sets, order: order };
    active  = me;
    enterApp();
  }

  async function resume(){
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (_){}
    if (!saved || !saved.keys || !window.crypto || !crypto.subtle) return;
    try {
      await start(saved.keys.map(function(k){ return { of: k.of, raw: b64(k.k) }; }));
    } catch (err){
      forget();   // המפתחות השמורים כבר לא מתאימים — חוזרים למסך הכניסה
    }
  }

  /* ---------- סימוני סטטוס ---------- */
  var toastTmr;
  function toast(text, bad){
    var el = $("toast");
    el.textContent = text;
    el.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTmr);
    toastTmr = setTimeout(function(){ el.className = "toast"; }, bad ? 4000 : 1800);
  }

  function myToken(){ return (session.sets[session.meId] || {}).wt; }

  function cacheMarks(){
    try { localStorage.setItem(MARKS_CACHE, JSON.stringify(marks)); } catch (_){}
  }
  function loadCachedMarks(){
    try { marks = JSON.parse(localStorage.getItem(MARKS_CACHE) || "{}") || {}; } catch (_){ marks = {}; }
  }

  async function pullMarks(){
    var t = myToken();
    if (!t) return;
    try {
      var r = await fetch(API + "?t=" + encodeURIComponent(t), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      var d = await r.json();
      marks = {};
      (d.updates || []).forEach(function(u){ marks[u.taskId] = u; });
      clearedAt = d.clearedAt || 0;
      history = d.history || [];
      statusOn = true;
      cacheMarks();
      renderAll();
    } catch (err){
      statusOn = false;   // אין צד שרת — מסתירים את הסימונים במקום להציג כפתור שנכשל
      renderAll();
    }
  }

  async function setStatus(taskId, status, note, addr, btn){
    var before = marks[taskId];
    if (status === null) delete marks[taskId];
    else marks[taskId] = { status: status, note: note || "", byName: labelOf(session.meId),
                           byId: session.meId, at: Date.now(), addr: addr };
    cacheMarks();
    renderAll();
    if (btn) btn.classList.add("saving");

    try {
      var r = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: myToken(), taskId: taskId, status: status, note: note || "", addr: addr }),
      });
      if (!r.ok) throw new Error(r.status);
      toast(status === null ? "הסימון בוטל" : "נשמר · " + status);
    } catch (err){
      if (before) marks[taskId] = before; else delete marks[taskId];
      cacheMarks();
      renderAll();
      toast("לא נשמר. בדקו חיבור ונסו שוב.", true);
    }
  }

  function closePop(){
    var open_ = document.querySelector(".stpop");
    if (open_) open_.remove();
    var bg = document.querySelector(".sheetbg");
    if (bg) bg.remove();
  }
  document.addEventListener("click", function(e){
    if (!e.target.closest(".stpop") && !e.target.closest(".st")) closePop();
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePop(); });

  function openPicker(row, t, btn){
    closePop();
    var cur = marks[t.id];
    var pop = document.createElement("div");
    pop.className = "stpop";
    pop.innerHTML =
      "<h5>" + esc(t.addr) + "</h5>" +
      '<div class="picks"><button type="button" class="w">בטיפול</button>' +
      '<button type="button" class="d">בוצע</button></div>' +
      '<textarea placeholder="הערה (לא חובה) — תופיע אצל ירין" maxlength="500"></textarea>' +
      '<div class="foot2">' +
        (cur ? '<button type="button" class="clear">בטל סימון</button>' : "<span></span>") +
        '<button type="button" class="close">סגירה</button>' +
      "</div>";
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    var ta = pop.querySelector("textarea");
    if (cur && cur.note) ta.value = cur.note;

    pop.querySelector(".w").addEventListener("click", function(){
      closePop(); setStatus(t.id, "בטיפול", ta.value, t.addr, btn);
    });
    pop.querySelector(".d").addEventListener("click", function(){
      closePop(); setStatus(t.id, "בוצע", ta.value, t.addr, btn);
    });
    var cl = pop.querySelector(".clear");
    if (cl) cl.addEventListener("click", function(){ closePop(); setStatus(t.id, null, "", t.addr, btn); });
    pop.querySelector(".close").addEventListener("click", closePop);

    if (window.matchMedia("(max-width:700px)").matches){
      var bg = document.createElement("div");
      bg.className = "sheetbg";
      bg.addEventListener("click", closePop);
      document.body.appendChild(bg);
    }
    row.appendChild(pop);
    // אם אין מקום למטה, נפתח כלפי מעלה; ואם השורה מתחת לסרגל הדביק — מגלגלים אליה
    var pr = pop.getBoundingClientRect();
    var topbar = document.querySelector(".topbar").getBoundingClientRect().bottom;
    if (pr.bottom > window.innerHeight - 8 && row.getBoundingClientRect().top - pr.height > topbar + 8){
      pop.classList.add("up");
    } else if (pop.getBoundingClientRect().top < topbar + 8){
      row.scrollIntoView({ block: "center" });
    }
  }

  /* ---------- תצוגה ---------- */
  function labelOf(id){ return (session.sets[id] || {}).name || "—"; }
  function visible(t){ return showFuture || !t.date || t.date <= TODAY; }
  function countVisible(id){ return (session.sets[id].tasks || []).filter(visible).length; }

  function enterApp(){
    $("gate").hidden = true;
    $("app").hidden  = false;
    $("who").textContent = "מחובר: " + labelOf(session.meId);
    $("email").value = ""; $("pass").value = "";

    // איפוס מלא של ממשק הניהול לפני כל כניסה — אחרת שאריות מסשן קודם
    // באותו דפדפן נשארות על המסך אצל משתמש רגיל.
    var bar = $("adminbar");
    bar.innerHTML = "";
    bar.hidden = true;
    $("futureWrap").hidden = true;
    $("future").checked = false;
    showFuture = false;

    if (session.isAdmin){
      bar.hidden = false;
      session.order.forEach(function(em){
        var b = document.createElement("button");
        b.type = "button"; b.className = "pill";
        b.setAttribute("aria-pressed", String(em === active));
        b.innerHTML = esc(labelOf(em)) + ' <span class="n">' + countVisible(em) + "</span>";
        b.addEventListener("click", function(){ active = em; view = "tasks"; renderAll(); });
        bar.appendChild(b);
      });
      $("futureWrap").hidden = false;
    }
    var rb = $("resumed");
    if (autoResumed){
      rb.hidden = false;
      rb.innerHTML = "";
      rb.appendChild(document.createTextNode("נכנסת אוטומטית כ־"));
      var b = document.createElement("b");
      b.textContent = labelOf(session.meId);
      rb.appendChild(b);
      rb.appendChild(document.createTextNode(". לא אתה?"));
      var sw = document.createElement("button");
      sw.type = "button";
      sw.textContent = "החלפת משתמש";
      sw.addEventListener("click", function(){ $("logout").click(); });
      rb.appendChild(sw);
    } else {
      rb.hidden = true;
    }

    loadCachedMarks();
    renderAll();
    pullMarks();
  }

  function ordOf(name){
    var c = DATA.types[name];                       // 0 הוא אינדקס תקין — אסור להסתמך על falsy
    return (c && typeof c.ord === "number") ? c.ord : 999;
  }

  function renderAll(){
    if (!session) return;
    var n = Object.keys(marks).filter(function(k){ return (marks[k].at || 0) > clearedAt; }).length;
    $("uBadge").textContent = n;
    $("toUpdates").hidden = !(session.isAdmin && statusOn && view === "tasks");
    $("toTasks").hidden   = (view !== "updates");
    if (view === "updates") renderUpdates(); else render();
  }

  function passesFilter(t){
    if (statusFilter === "all") return true;
    var m = marks[t.id];
    if (statusFilter === "open")    return !m;
    if (statusFilter === "working") return !!m && m.status === "בטיפול";
    if (statusFilter === "done")    return !!m && m.status === "בוצע";
    return true;
  }

  function buildFilters(all){
    var box = $("filters");
    if (!statusOn){ box.hidden = true; box.innerHTML = ""; return; }
    var counts = {
      all: all.length,
      open: all.filter(function(t){ return !marks[t.id]; }).length,
      working: all.filter(function(t){ return marks[t.id] && marks[t.id].status === "בטיפול"; }).length,
      done: all.filter(function(t){ return marks[t.id] && marks[t.id].status === "בוצע"; }).length,
    };
    if (!counts.working && !counts.done && statusFilter === "all"){ box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML = "";
    [["all","הכל"],["open","פתוחות"],["working","בטיפול"],["done","בוצעו"]].forEach(function(f){
      var b = document.createElement("button");
      b.type = "button"; b.className = "pill";
      b.setAttribute("aria-pressed", String(statusFilter === f[0]));
      b.innerHTML = f[1] + ' <span class="n">' + counts[f[0]] + "</span>";
      b.addEventListener("click", function(){ statusFilter = f[0]; renderAll(); });
      box.appendChild(b);
    });
  }

  function matches(t){
    if (!query) return true;
    return (t.name + " " + (t.desc || "") + " " + (t.notes || "") + " " + (t.pstatus || "") + " " + (t.type || ""))
             .toLowerCase().indexOf(query) >= 0;
  }

  function render(){
    var pool  = ((session.sets[active] || {}).tasks || []).filter(function(t){ return visible(t) && matches(t); });
    buildFilters(pool);
    var tasks = pool.filter(passesFilter);

    $("content").hidden = false;
    $("updatesView").hidden = true;
    var mine = (active === session.meId);
    $("viewTitle").textContent = mine ? "המשימות שלי" : "משימות · " + labelOf(active);

    var vb = $("viewing");
    vb.hidden = mine;
    if (!mine){
      vb.innerHTML = "";
      vb.appendChild(document.createTextNode("אתה צופה במשימות של " + labelOf(active) + " — בתור מנהל."));
      var back = document.createElement("button");
      back.type = "button";
      back.textContent = "חזרה למשימות שלי";
      back.addEventListener("click", function(){ active = session.meId; renderAll(); });
      vb.appendChild(back);
    }

    if (session.isAdmin){
      var kids = $("adminbar").children;
      for (var i = 0; i < kids.length; i++){
        kids[i].setAttribute("aria-pressed", String(session.order[i] === active));
        kids[i].querySelector(".n").textContent = countVisible(session.order[i]);
      }
    }

    var done = pool.filter(function(t){ return marks[t.id] && marks[t.id].status === "בוצע"; }).length;
    var busy = pool.filter(function(t){ return marks[t.id] && marks[t.id].status === "בטיפול"; }).length;

    $("eyebrow").textContent = new Intl.DateTimeFormat("he-IL", {
      timeZone:"Asia/Jerusalem", weekday:"long", day:"numeric", month:"long" }).format(new Date());

    var chips = '<span class="stat">משימות <b>' + pool.length + "</b></span>";
    if (busy) chips += '<span class="stat">בטיפול <b>' + busy + "</b></span>";
    if (done) chips += '<span class="stat done">בוצעו <b>' + done + "</b></span>";
    $("stats").innerHTML = chips;
    $("synced").textContent = "עודכן מהלוח: " + DATA.syncedAt;
    drawRing(done, pool.length);

    var box = $("content");
    box.innerHTML = "";
    if (!tasks.length){
      box.innerHTML = query
        ? '<div class="empty"><strong>אין תוצאות לחיפוש</strong>נסו ניסוח אחר.</div>'
        : '<div class="empty"><span class="big">✓</span><strong>הכל נקי</strong>אין משימות פתוחות עד היום.</div>';
      return;
    }

    var keys = [], buckets = {};
    tasks.forEach(function(t){
      var k = (sortMode === "type") ? (t.type || NO_TYPE) : t.group;
      if (!buckets[k]){ buckets[k] = []; keys.push(k); }
      buckets[k].push(t);
    });
    if (sortMode === "type"){
      keys.sort(function(a, b){ return ordOf(a) - ordOf(b); });
    }

    keys.forEach(function(k){
      var c = ((sortMode === "type") ? DATA.types[k] : DATA.groupColors[k]) || GREY;
      var sec = document.createElement("section");
      sec.className = "group";
      sec.style.setProperty("--gc",   c.bg);
      sec.style.setProperty("--gc-l", c.light);
      sec.style.setProperty("--gc-d", c.dark);
      sec.innerHTML = '<div class="ghead"><span class="dot"></span><span class="gname">' +
                      esc(k) + '</span> <span class="gn">' + buckets[k].length + "</span></div>";
      var rows = document.createElement("div");
      rows.className = "rows";
      buckets[k].forEach(function(t){ addRow(rows, t); });
      sec.appendChild(rows);
      box.appendChild(sec);
    });
  }

  async function clearUpdates(){
    try {
      var r = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: myToken(), clear: true }),
      });
      if (!r.ok) throw new Error(r.status);
      var d = await r.json();
      clearedAt = d.clearedAt || Date.now();
      toast("נוקה");
      renderAll();
    } catch (err){
      toast("הניקוי נכשל. נסו שוב.", true);
    }
  }

  function dayLabel(ts){
    var f = new Intl.DateTimeFormat("he-IL", { timeZone:"Asia/Jerusalem", weekday:"long", day:"numeric", month:"numeric" });
    return f.format(new Date(ts));
  }
  function timeLabel(ts){
    return new Intl.DateTimeFormat("he-IL", { timeZone:"Asia/Jerusalem", hour:"2-digit", minute:"2-digit" }).format(new Date(ts));
  }

  function renderUpdates(){
    var isHistory = updatesSub === "history";
    $("viewTitle").textContent = isHistory ? "היסטוריית עדכונים" : "עדכונים מהצוות";
    $("viewing").hidden = true;
    $("statusline").innerHTML = "";
    $("content").hidden = true;
    var box = $("updatesView");
    box.hidden = false;
    box.innerHTML = "";

    var list = isHistory
      ? history.slice()
      : Object.keys(marks).map(function(k){ return marks[k]; }).filter(function(u){ return (u.at || 0) > clearedAt; });
    list.sort(function(a, b){ return (b.at || 0) - (a.at || 0); });

    if (session.isAdmin){
      var tools = document.createElement("div");
      tools.className = "utools";
      var histBtn = document.createElement("button");
      histBtn.type = "button"; histBtn.className = "linkbtn";
      histBtn.textContent = isHistory ? "← לעדכונים" : "היסטוריה";
      histBtn.addEventListener("click", function(){ updatesSub = isHistory ? "active" : "history"; renderAll(); });
      tools.appendChild(histBtn);
      if (!isHistory && list.length){
        var clearBtn = document.createElement("button");
        clearBtn.type = "button"; clearBtn.className = "linkbtn";
        clearBtn.textContent = "ניקוי";
        clearBtn.addEventListener("click", clearUpdates);
        tools.appendChild(clearBtn);
      }
      box.appendChild(tools);
    }

    if (!list.length){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = isHistory
        ? "<strong>אין היסטוריה עדיין</strong>כאן יופיעו כל העדכונים שנרשמו אי פעם."
        : "<strong>אין עדכונים חדשים</strong>כשמישהו יסמן משימה כבטיפול או כבוצע, היא תופיע כאן.";
      box.appendChild(empty);
      return;
    }

    var wrap = document.createElement("div");
    wrap.className = "ulist";
    var lastDay = null;
    list.forEach(function(u){
      var day = dayLabel(u.at);
      if (day !== lastDay){
        lastDay = day;
        var h = document.createElement("div");
        h.className = "uday";
        h.textContent = day;
        wrap.appendChild(h);
      }
      var c = DATA.types[u.status] || null;
      var bg = u.status === "בוצע" ? "#00c875" : "#fdab3d";
      var el = document.createElement("div");
      el.className = "uitem";
      el.innerHTML =
        '<span class="chip" style="background:' + bg + ';color:#1d2129">' + esc(u.status) + "</span>" +
        '<span class="uwho">' + esc(u.byName || "—") + "</span>" +
        '<span class="uaddr">' + esc(u.addr || u.taskId) + "</span>" +
        '<span class="utime">' + timeLabel(u.at) + "</span>" +
        (u.note ? '<span class="unote">' + esc(u.note) + "</span>" : "");
      wrap.appendChild(el);
    });
    box.appendChild(wrap);
  }

  function drawRing(done, total){
    var el = $("ring");
    if (!statusOn || !total || !done){ el.hidden = true; return; }
    el.hidden = false;
    var pct = Math.round((done / total) * 100), R = 24, C = 2 * Math.PI * R;
    el.innerHTML =
      '<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">' +
        '<circle cx="28" cy="28" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="5"></circle>' +
        '<circle cx="28" cy="28" r="' + R + '" fill="none" stroke="var(--ok)" stroke-width="5"' +
          ' stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '"' +
          ' stroke-dashoffset="' + (C * (1 - done / total)).toFixed(1) + '"></circle>' +
      "</svg>" +
      '<span class="val">' + pct + "%</span>";
    el.title = done + " מתוך " + total + " סומנו כבוצעו";
  }

  function addRow(container, t){
    var mk = marks[t.id];
    var has = !!(t.desc || t.notes || t.pstatus);

    var row = document.createElement("div");
    row.className = "row";
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-expanded", "false");

    // עיגול הסימון — הפעולה העיקרית, יעד מגע מלא
    var stb = document.createElement("button");
    stb.type = "button";
    stb.className = "st" + (mk ? (mk.status === "בוצע" ? " done" : " working") : "");
    stb.textContent = mk ? (mk.status === "בוצע" ? "✓" : "●") : "";
    stb.setAttribute("aria-label", mk ? "הסטטוס: " + mk.status : "סימון המשימה");
    stb.title = mk ? mk.status : "סימון כבטיפול או כבוצע";
    if (statusOn){
      stb.addEventListener("click", function(e){ e.stopPropagation(); openPicker(row, t, stb); });
      row.appendChild(stb);
    }

    var main = document.createElement("div");
    main.className = "rmain";

    // תאריך שכבר עבר פשוט נהיה משימה של היום, בלי ציון פיגור — משימות מסוימות
    // נמשכות זמן, וזה לא מידע שרלוונטי להציג בשורה. מוצג רק תאריך עתידי (תצוגת "כולל עתידיות").
    var dTxt = "";
    if (t.date){
      var d = delta(t.date);
      if (d > 0) dTxt = short(t.date);
    }

    var chip = "";
    if (t.type){
      var c = DATA.types[t.type];
      chip = c ? '<span class="chip" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(t.type) + "</span>"
               : '<span class="chip">' + esc(t.type) + "</span>";
    }

    main.innerHTML =
      '<div class="rline">' +
        '<span class="addr">' + esc(t.addr) + "</span>" +
        (t.city ? '<span class="city">' + esc(t.city) + "</span>" : "") +
        chip +
        (dTxt ? '<span class="date">' + esc(dTxt) + "</span>" : "") +
      "</div>" +
      (t.desc ? '<div class="rprev">' + esc(oneLine(t.desc)) + "</div>" : "");
    row.appendChild(main);

    if (t.desc) {
      var pop = document.createElement("div");
      pop.className = "pop";
      pop.textContent = t.desc;
      row.appendChild(pop);
    }

    var detail = document.createElement("div");
    detail.className = "detail";
    var html = t.desc ? '<p class="task-desc">' + esc(t.desc) + "</p>" : "";
    if (t.pstatus) html += '<div class="bgsec"><h4>סטטוס הפרויקט</h4><p>' + richText(t.pstatus) + "</p></div>";
    if (t.notes)   html += '<div class="bgsec"><h4>תיאור ואנשי קשר</h4><p>' + richText(t.notes) + "</p></div>";
    detail.innerHTML = html;

    function toggle(){
      if (!has) return;
      var open = row.classList.toggle("open");
      row.setAttribute("aria-expanded", String(open));
    }
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", function(e){
      if (e.target !== row) return;
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
    });

    container.appendChild(row);
    container.appendChild(detail);
  }

  /* ---------- פקדים ---------- */
  var tmr;
  $("search").addEventListener("input", function(e){
    clearTimeout(tmr);
    var v = e.target.value.trim().toLowerCase();
    tmr = setTimeout(function(){ query = v; renderAll(); }, 120);
  });
  function setSort(mode){
    sortMode = mode;
    $("sortBoard").setAttribute("aria-pressed", String(mode === "board"));
    $("sortType").setAttribute("aria-pressed",  String(mode === "type"));
    view = "tasks"; renderAll();
  }
  $("sortBoard").addEventListener("click", function(){ setSort("board"); });
  $("sortType").addEventListener("click",  function(){ setSort("type");  });
  $("future").addEventListener("change", function(e){ showFuture = e.target.checked; renderAll(); });
  $("toUpdates").addEventListener("click", function(){ view = "updates"; renderAll(); });
  $("toTasks").addEventListener("click",   function(){ view = "tasks";   renderAll(); });
  $("logout").addEventListener("click", function(){
    session = null; marks = {}; view = "tasks"; autoResumed = false; forget();
    clearedAt = 0; history = []; updatesSub = "active";
    $("resumed").hidden = true;
    $("viewing").hidden = true;
    $("adminbar").innerHTML = ""; $("adminbar").hidden = true;
    $("futureWrap").hidden = true; $("future").checked = false; showFuture = false;
    $("toUpdates").hidden = true; $("toTasks").hidden = true;
    $("search").value = ""; query = ""; statusFilter = "all";
    $("filters").innerHTML = ""; $("filters").hidden = true;
    $("content").innerHTML = ""; $("updatesView").innerHTML = "";
    $("stats").innerHTML = ""; $("ring").hidden = true;
    try { localStorage.removeItem(MARKS_CACHE); } catch (_){}
    $("app").hidden = true; $("gate").hidden = false;
    $("pass").value = ""; $("gateMsg").textContent = "";
  });

  $("foot").textContent =
    "הנתונים נשלפים מלוח המשימות ומוצגים לקריאה בלבד — שינוי סטטוס או תוכן נעשה בלוח עצמו. " +
    "מוצגות משימות שתאריך הפולו־אפ שלהן הוא היום או קודם לכן.";

  resume();
})();
</script>
</body>
</html>
