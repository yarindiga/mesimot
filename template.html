<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>לוח הפולו־אפ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Assistant:wght@400;500;600;700&display=swap');

:root{
  --paper:#f4f3f0;
  --surface:#ffffff;
  --surface-2:#faf9f7;
  --hover:#f1efeb;
  --ink:#14171c;
  --ink-2:#49515f;
  --muted:#8b8f98;
  --line:#e7e4df;
  --line-strong:#d4d0c9;
  --accent:#4338ca;
  --accent-soft:#ecebfc;
  --signal:#c0392b;
  --signal-soft:#fdecea;
  --ok:#0e8b52;
  --ok-soft:#e6f6ee;
  --work:#a9690a;
  --work-soft:#fdf3e2;
  --on-accent:#ffffff;
  --mw:#fdab3d;
  --md:#00c875;
  --shadow-1:0 1px 2px rgba(20,20,25,.05);
  --shadow-2:0 10px 30px rgba(20,20,25,.12);
  --shadow-3:0 22px 55px rgba(20,20,25,.20);
  --font-display:'Frank Ruhl Libre','Times New Roman',serif;
  --font-body:'Assistant','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:12px;
  --maxw:1280px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1115; --surface:#171a20; --surface-2:#1d2128; --hover:#222731;
    --ink:#eceef2; --ink-2:#bcc2cc; --muted:#878e9a;
    --line:#272c35; --line-strong:#3a414d;
    --accent:#8b87f5; --accent-soft:#211f3c;
    --signal:#f08a76; --signal-soft:#3a1e18;
    --ok:#5cc794; --ok-soft:#10291f;
    --work:#e0a94a; --work-soft:#2e2413;
    --on-accent:#111119;
    --shadow-1:0 1px 2px rgba(0,0,0,.40);
    --shadow-2:0 10px 30px rgba(0,0,0,.50);
    --shadow-3:0 22px 55px rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1115; --surface:#171a20; --surface-2:#1d2128; --hover:#222731;
  --ink:#eceef2; --ink-2:#bcc2cc; --muted:#878e9a;
  --line:#272c35; --line-strong:#3a414d;
  --accent:#8b87f5; --accent-soft:#211f3c;
  --signal:#f08a76; --signal-soft:#3a1e18;
  --ok:#5cc794; --ok-soft:#10291f;
  --work:#e0a94a; --work-soft:#2e2413;
  --on-accent:#111119;
  --shadow-1:0 1px 2px rgba(0,0,0,.40);
  --shadow-2:0 10px 30px rgba(0,0,0,.50);
  --shadow-3:0 22px 55px rgba(0,0,0,.62);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.5;
  direction:rtl;text-align:right;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ============ כניסה ============ */
.gate{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px 18px;
  background:
    radial-gradient(1100px 620px at 78% -8%, var(--accent-soft), transparent 62%),
    radial-gradient(760px 520px at 8% 104%, var(--hover), transparent 60%);
}
.gate-card{
  width:100%;max-width:392px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:34px 30px 26px;box-shadow:var(--shadow-3);
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:31px;margin:0;letter-spacing:-.02em}
.brand .tick{
  width:34px;height:34px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 60%, #000 12%));
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;
  box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 34%, transparent);
}
.gate-sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.field{display:block;margin-bottom:15px}
.field span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r);transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.remember{display:flex;align-items:center;gap:9px;margin:4px 0 20px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.remember input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.btn{
  width:100%;padding:13px;background:var(--accent);color:#fff;border:0;
  border-radius:var(--r);font-weight:700;font-size:15.5px;cursor:pointer;
  transition:filter .15s,transform .12s;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%, transparent);
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:progress}
.gate-msg{min-height:20px;margin-top:12px;font-size:13.5px;color:var(--signal);font-weight:600}
.gate-note{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* ============ מעטפת ============ */
.app{max-width:var(--maxw);margin:0 auto;padding:0 16px 80px}

.stickytop{
  position:sticky;top:0;z-index:40;margin:0 -16px;padding:0 16px;
  background:color-mix(in srgb,var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.stickytop.scrolled{border-bottom-color:var(--line)}
.inner{max-width:var(--maxw);margin:0 auto}

/* ---- שורת אפליקציה ---- */
.appbar{display:flex;align-items:center;gap:8px;height:58px}
.mark{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mark .dot{
  width:28px;height:28px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 58%, #000 14%));
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;
}
.mark .name{
  font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);
  letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.iconbtn{
  position:relative;flex:none;height:38px;min-width:38px;padding:0 10px;border-radius:11px;
  border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:600;transition:background .15s,color .15s,border-color .15s;
}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;flex:none}
.iconbtn.primary{background:var(--accent-soft);color:var(--accent)}
.iconbtn.primary:hover{background:color-mix(in srgb,var(--accent-soft) 70%, var(--accent) 12%)}
.badge{
  min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.badge[data-zero="1"]{background:var(--line-strong);color:var(--ink-2)}
.who{
  font-size:12.5px;color:var(--muted);white-space:nowrap;
  padding-inline-end:4px;
}

/* ---- פס היום ---- */
.today{padding:6px 0 14px}
.today-row{display:flex;align-items:flex-end;gap:14px}
.today-row > div:first-child{flex:1;min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted)}
.today h2{
  font-family:var(--font-display);font-weight:700;font-size:26px;margin:1px 0 0;
  letter-spacing:-.025em;text-wrap:balance;line-height:1.2;
}
.pct{
  flex:none;text-align:center;font-variant-numeric:tabular-nums;
}
.pct b{display:block;font-size:20px;font-weight:700;color:var(--ok);line-height:1.1}
.pct span{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:11px}
.track i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .45s cubic-bezier(.2,.7,.3,1)}
.stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.stat{
  display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);
  box-shadow:var(--shadow-1);
}
.stat b{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.work{background:var(--work-soft);border-color:transparent;color:var(--work)}
.stat.work b{color:var(--work)}
.stat.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.stat.done b{color:var(--ok)}
.synced{margin:9px 0 0;font-size:11.5px;color:var(--muted)}

/* ---- סרגל כלים ---- */
.toolbar{padding-bottom:10px;display:flex;flex-direction:column;gap:8px}
.tbrow{display:flex;align-items:center;gap:8px}
.searchwrap{position:relative;flex:1;min-width:0}
.searchwrap svg{
  position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none;
}
.search{
  width:100%;padding:11px 40px 11px 14px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .15s;
}
.search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.barlabel{
  margin:0;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  flex:none;align-self:center;padding-inline-end:2px;
}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0;align-items:center}
.chiprow::-webkit-scrollbar{display:none}
.pill{
  flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;
  font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .12s;
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill:active{transform:scale(.97)}
.pill .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill[aria-pressed="true"]:hover{color:#fff}
.pill[aria-pressed="true"] .n{color:#fff;opacity:.78}
.statusline{display:none}

.banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);
  padding:11px 15px;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow-1);
}
.banner b{color:var(--ink)}
.banner.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.banner button{
  margin-inline-start:auto;background:var(--accent);color:#fff;border:0;
  border-radius:999px;padding:6px 15px;font-size:12.5px;font-weight:700;cursor:pointer;
}

/* ============ פריסה ============ */
.layout{display:block}
.pane{display:none}
@media (min-width:1080px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;align-items:start}
  .pane{
    display:block;position:sticky;top:calc(var(--sticky-h,150px) + 16px);
    max-height:calc(100dvh - var(--sticky-h,150px) - 34px);overflow:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow-1);padding:20px;scrollbar-width:thin;
  }
}
.pane-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 10px}
.pane-empty .ico{font-size:26px;display:block;margin-bottom:8px;opacity:.55}
.pane h3{
  font-family:var(--font-display);font-size:21px;margin:0;letter-spacing:-.02em;line-height:1.25;
}
.pane .pane-city{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.pane-head{display:flex;align-items:flex-start;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.pane-head > div:first-child{flex:1;min-width:0}

/* ============ קבוצות ושורות ============ */
.group{margin-top:20px}
.group:first-child{margin-top:4px}
.ghead{
  position:sticky;top:var(--sticky-h,120px);z-index:20;
  display:flex;align-items:center;gap:8px;padding:7px 2px;margin-bottom:8px;
  font-size:12.5px;font-weight:700;
  background:color-mix(in srgb,var(--paper) 90%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.ghead .dot{width:9px;height:9px;border-radius:3px;background:var(--gc);flex:none}
.ghead .gname{color:var(--gc-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ghead .gname{color:var(--gc-d)}}
:root[data-theme="dark"] .ghead .gname{color:var(--gc-d)}
.ghead .gn{
  color:var(--muted);font-weight:700;font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;
}
.ghead::after{content:"";flex:1;height:1px;background:var(--line)}

.rows{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-1);overflow:hidden;
}
.row{
  position:relative;display:flex;align-items:flex-start;gap:12px;
  padding:13px 16px 13px 12px;border-top:1px solid var(--line);cursor:pointer;
  transition:background .14s;
}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--gc)}
.row:hover{background:var(--hover)}
.row.open{background:var(--hover)}
.row.is-done{background:color-mix(in srgb,var(--ok-soft) 55%, transparent)}
.row.is-done .addr{color:var(--ink-2)}
.row.is-work::before{background:var(--mw)}
.row.is-done::before{background:var(--md)}

/* עיגול הסימון — הפעולה הראשית */
.st{
  position:relative;flex:none;margin-top:1px;width:28px;height:28px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:2px solid var(--line-strong);background:var(--surface);color:transparent;
  border-radius:50%;cursor:pointer;font-size:14px;font-weight:700;line-height:1;
  transition:border-color .15s,background .15s,color .15s,transform .12s,box-shadow .15s;
}
/* יעד מגע אמיתי של כ-46x46 סביב העיגול, בלי לשנות את הגודל הוויזואלי */
.st::after{content:"";position:absolute;inset:-9px}
.st:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.st:active{transform:scale(.88)}
.st.working{border-color:var(--mw);background:var(--mw);color:#3d2a06}
.st.done{border-color:var(--md);background:var(--md);color:#062b18}
.st.saving{opacity:.5;cursor:progress}

.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rline{display:flex;align-items:center;gap:8px}
.addr{
  font-weight:600;font-size:15.5px;letter-spacing:-.01em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.city{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
.chip{
  flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;
  background:var(--line);color:var(--ink-2);white-space:nowrap;line-height:1.5;
}
.date{
  flex:none;font-size:11.5px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;
}
.rprev{
  font-size:12.5px;line-height:1.45;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row.open .rprev{display:none}
.rside{display:flex;align-items:center;gap:6px;flex:none;margin-inline-start:auto}
.callbtn{
  flex:none;width:36px;height:36px;border-radius:11px;text-decoration:none;
  border:1px solid var(--line);background:var(--surface-2);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,transform .12s,border-color .15s;
}
.callbtn svg{width:16px;height:16px}
.callbtn:hover{background:var(--accent-soft);border-color:transparent}
.callbtn:active{transform:scale(.92)}

.detail{display:none;padding:2px 26px 18px 50px;background:var(--hover);border-top:1px solid var(--line)}
.row.open + .detail{display:block}
/* במסך רחב הפירוט חי בפאנל הצדדי בלבד — חייב לבוא אחרי הכלל שמעליו, אחרת הוא מפסיד לו */
@media (min-width:1080px){
  .row.open + .detail{display:none}
  .row.open{background:var(--accent-soft)}
}

/* ---- תוכן הפירוט (משותף לפאנל ולשורה) ---- */
.dsec{margin-top:16px}
.dsec > h4{
  margin:0 0 7px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);
  display:flex;align-items:center;gap:7px;
}
.dsec > h4::after{content:"";flex:1;height:1px;background:var(--line)}
.dtask{
  margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-size:14.5px;line-height:1.55;
  font-weight:500;
}
.dbox{
  margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.6;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
}
.dsec a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

/* טיימליין של "סטטוס הפרויקט" */
.tl{position:relative;margin:0;padding:0;list-style:none;max-height:330px;overflow-y:auto;scrollbar-width:thin}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-inline-start:24px;padding-bottom:15px}
.tl-item:last-child{padding-bottom:2px}
.tl-dot{
  position:absolute;inset-inline-start:1px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-strong);
}
.tl-item.newest .tl-dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-date{
  font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.tl-item.newest .tl-date::after{
  content:"אחרון";margin-inline-start:7px;font-size:9.5px;letter-spacing:.06em;
  background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;
}
.tl-body{margin-top:3px;font-size:13.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.tl-body a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

/* אנשי קשר */
.tels{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.telchip{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:6px 13px 6px 10px;font-size:13px;font-weight:700;direction:ltr;
  font-variant-numeric:tabular-nums;transition:filter .15s,transform .12s;
}
.telchip svg{width:14px;height:14px}
.telchip:hover{filter:brightness(.96)}
.telchip:active{transform:scale(.96)}

/* ============ גיליון סימון סטטוס ============ */
.sheetbg{
  position:fixed;inset:0;z-index:55;background:rgba(10,12,18,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;z-index:60;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-3);
  padding:20px;text-align:right;cursor:default;
  inset-inline:0;margin-inline:auto;width:min(420px,calc(100vw - 32px));
  top:50%;transform:translateY(-50%);animation:pop .2s cubic-bezier(.2,.7,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.96)}to{opacity:1;transform:translateY(-50%) scale(1)}}
.sheet h5{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.sheet .sub{margin:2px 0 16px;font-size:12.5px;color:var(--muted)}
.picks{display:flex;gap:10px;margin-bottom:14px}
.picks button{
  flex:1;border:2px solid transparent;border-radius:14px;background:var(--surface-2);
  padding:15px 8px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .12s,border-color .15s,background .15s;
}
.picks button .bub{
  width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:14px;
}
.picks .w .bub{background:var(--mw);color:#3d2a06}
.picks .d .bub{background:var(--md);color:#062b18}
.picks button:hover{background:var(--hover)}
.picks button:active{transform:scale(.97)}
.picks .w[aria-pressed="true"]{border-color:var(--mw);background:var(--work-soft)}
.picks .d[aria-pressed="true"]{border-color:var(--md);background:var(--ok-soft)}
.sheet label.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.sheet textarea{
  width:100%;min-height:86px;resize:vertical;padding:11px 13px;font-size:14px;line-height:1.5;
  border:1px solid var(--line-strong);border-radius:12px;background:var(--surface-2);color:var(--ink);
}
.sheet textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.lastnote{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;margin-bottom:12px;font-size:12.5px;color:var(--ink-2);line-height:1.5;
}
.lastnote b{display:block;font-size:10.5px;letter-spacing:.05em;color:var(--muted);margin-bottom:3px;font-weight:700}
.sheet .foot2{display:flex;align-items:center;gap:8px;margin-top:14px}
.sheet .save{
  flex:1;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px;
  font-size:14.5px;font-weight:700;cursor:pointer;transition:filter .15s,transform .12s;
}
.sheet .save:hover{filter:brightness(1.07)}
.sheet .save:active{transform:translateY(1px)}
.sheet .save[disabled]{opacity:.45;cursor:not-allowed}
.sheet .clear{background:none;border:0;color:var(--signal);font-size:13px;font-weight:600;cursor:pointer;padding:9px 10px;border-radius:9px}
.sheet .clear:hover{background:var(--signal-soft)}
.sheet .close{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:9px 10px;border-radius:9px}
.sheet .close:hover{background:var(--hover)}

@media (max-width:700px){
  .sheet{
    inset-inline:0;bottom:0;top:auto;transform:none;width:auto;
    border-radius:22px 22px 0 0;border-bottom:0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    animation:sheetup .24s cubic-bezier(.2,.7,.3,1);max-height:92dvh;overflow-y:auto;
  }
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  .sheet::before{
    content:"";display:block;width:38px;height:4px;border-radius:99px;
    background:var(--line-strong);margin:0 auto 14px;
  }
  .picks button{padding:17px 8px;font-size:15.5px}
  .sheet textarea{font-size:16px}
}

.toast{
  position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom));
  margin:0 auto;width:max-content;max-width:90vw;z-index:90;
  background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);
  opacity:0;transform:translateY(12px);transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}
.toast.bad{background:var(--signal);color:#fff}

/* ============ עדכונים ============ */
.utools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ulist{display:flex;flex-direction:column;gap:9px}
.uday{
  font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:18px 2px 5px;
  display:flex;align-items:center;gap:8px;
}
.uday::after{content:"";flex:1;height:1px;background:var(--line)}
.uitem{
  display:flex;align-items:flex-start;gap:11px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow-1);
}
.uava{
  flex:none;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;
}
.ubody{flex:1;min-width:0}
.uhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uaddr{font-size:14.5px;font-weight:700;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uwho{font-size:12.5px;color:var(--muted);font-weight:600}
.utime{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-inline-start:auto;flex:none}
.unote{
  margin-top:7px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55;
  border-inline-start:3px solid var(--line-strong);padding-inline-start:11px;
}

.empty{
  text-align:center;padding:56px 24px;color:var(--muted);
  border:1px dashed var(--line-strong);border-radius:18px;margin-top:20px;background:var(--surface-2);
}
.empty strong{display:block;font-family:var(--font-display);font-size:22px;color:var(--ink-2);margin-bottom:6px}
.empty .big{font-size:34px;display:block;margin-bottom:10px;color:var(--ok)}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}

@media (max-width:620px){
  /* בטלפון החיפוש מקבל שורה משלו — אחרת הוא נדחס מול המיון ו"עתידיות" */
  .tbrow{flex-wrap:wrap}
  .searchwrap{flex:1 0 100%}
}
@media (max-width:560px){
  .app{padding:0 12px 72px}
  .stickytop{margin:0 -12px;padding:0 12px}
  .today h2{font-size:22px}
  .appbar{height:54px}
  .row{padding:12px 13px 12px 10px}
  .detail{padding:2px 16px 16px 16px}
  .iconbtn{padding:0 8px}
  .iconbtn .lbl2{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="bundle" type="application/json">__PAYLOAD__</script>
<script>
(function(){
  "use strict";
  document.documentElement.lang = "he";
  document.documentElement.dir  = "rtl";

  var DATA = JSON.parse(document.getElementById("bundle").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var STORE_KEY = "tb.remember";
  var NO_TYPE = "ללא סוג";
  var GREY = { bg:"#c4c4c4", light:"#5b6b7a", dark:"#8698a7", ord:999 };

  /* ---------- הצפנה ---------- */
  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(bytes){
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  async function kek(password, saltB64, iters){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(saltB64), iterations:iters, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  }
  async function unseal(key, box){
    return new Uint8Array(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(box.iv) }, key, b64(box.ct)));
  }
  async function rawToKey(bytes){
    return crypto.subtle.importKey("raw", bytes, "AES-GCM", false, ["decrypt"]);
  }
  async function unsealJSON(key, box){
    // הריפוד שמסתיר את גודל המידע נחתך לפני הפענוח
    return JSON.parse(new TextDecoder().decode(await unseal(key, box)).replace(/[\s\0]+$/, ""));
  }

  async function uid(email){
    var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(DATA.siteSalt + ":" + email));
    var b = new Uint8Array(h), out = "";
    for (var i = 0; i < b.length; i++) out += b[i].toString(16).padStart(2, "0");
    return out.slice(0, 32);
  }

  /* ---------- תאריכים ---------- */
  var TODAY = new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Jerusalem", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
  function delta(iso){ return Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(TODAY + "T00:00:00Z")) / 86400000); }
  function short(iso){ var p = iso.split("-"); return (+p[2]) + "." + (+p[1]); }

  /* ---------- טקסט ---------- */
  function oneLine(s){ return s.replace(/\s*\n+\s*/g, " · ").trim(); }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; });
  }
  var RE_PHONE = /\b0\d{1,2}[-‑ ]?\d{3}[-‑ ]?\d{4}\b/g;
  var RE_MAIL  = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g;
  function richText(s){
    var out = esc(s).replace(RE_MAIL, function(m){ return '<a href="mailto:' + m + '" dir="ltr">' + m + "</a>"; });
    return out.replace(RE_PHONE, function(m){
      return /@/.test(m) ? m : '<a href="tel:' + m.replace(/\D/g, "") + '" dir="ltr">' + m + "</a>";
    });
  }

  /* ---------- מצב ---------- */
  var session = null, active = null, query = "", showFuture = false, sortMode = "board";
  var autoResumed = false;
  var statusFilter = "all";
  var marks = {};        // taskId -> {status, note, byName, at}
  var statusOn = false;  // נדלק רק כשצד השרת עונה — עד אז אין כפתורי סימון
  var view  = "tasks";
  var API   = "/api/updates";
  var MARKS_CACHE = "tb.marks";
  var openId = null;     // המשימה הפתוחה — שורה מורחבת בטלפון, פאנל צדדי במחשב
  var clearedAt = 0;     // מנהל בלבד: חותם הזמן של "ניקוי" אחרון במסך העדכונים
  var history = [];      // מנהל בלבד: כל העדכונים שנרשמו אי פעם, גם אחרי ניקוי
  var updatesSub = "active"; // "active" | "history"

  /* ---------- כניסה ---------- */
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    signIn($("email").value.trim().toLowerCase(), $("pass").value, $("remember").checked);
  });

  var BAD = "אימייל או סיסמה שגויים.";

  async function signIn(email, password, remember){
    var msg = $("gateMsg"), btn = $("loginBtn");
    msg.textContent = "";
    if (!window.crypto || !crypto.subtle){
      msg.textContent = "הדפדפן חוסם פענוח מאובטח. נסו דפדפן אחר.";
      return;
    }

    btn.disabled = true; btn.textContent = "מאמת…";
    try {
      var rec = DATA.records[await uid(email)];
      // אימייל לא מוכר עובר את אותה עבודת גזירה, כדי שזמן התגובה לא יסגיר מי קיים
      var probe = rec || { salt: DATA.decoySalt, keys: [] };
      var wrap  = await kek(password, probe.salt, DATA.iter);

      var raws = [];
      for (var i = 0; i < probe.keys.length; i++){
        try { raws.push({ of: probe.keys[i].of, raw: await unseal(wrap, probe.keys[i].wrapped) }); }
        catch (_){ /* מפתח של מישהו אחר או דמה — מדלגים */ }
      }
      if (!raws.length) throw new Error("no keys");

      autoResumed = false;
      await start(raws);
      if (remember) remember_(raws); else forget();
    } catch (err){
      msg.textContent = BAD;
    } finally {
      btn.disabled = false; btn.textContent = "כניסה";
    }
  }

  function remember_(raws){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        keys: raws.map(function(r){ return { of: r.of, k: toB64(r.raw) }; })
      }));
    } catch (_){}
  }
  function forget(){ try { localStorage.removeItem(STORE_KEY); } catch (_){} }

  async function start(raws){
    var sets = {}, order = [], me = null;
    for (var i = 0; i < raws.length; i++){
      var id = raws[i].of;
      if (!DATA.blobs[id]) continue;
      var body = await unsealJSON(await rawToKey(raws[i].raw), DATA.blobs[id]);
      sets[id] = body; order.push(id);
      if (body.admin) me = id;
    }
    if (!order.length) throw new Error("no data");
    if (!me) me = order[0];
    order.sort(function(a, b){ return (a === me ? -1 : 0) - (b === me ? -1 : 0); });

    session = { meId: me, isAdmin: !!sets[me].admin, sets: sets, order: order };
    active  = me;
    enterApp();
  }

  async function resume(){
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (_){}
    if (!saved || !saved.keys || !window.crypto || !crypto.subtle) return;
    try {
      await start(saved.keys.map(function(k){ return { of: k.of, raw: b64(k.k) }; }));
    } catch (err){
      forget();   // המפתחות השמורים כבר לא מתאימים — חוזרים למסך הכניסה
    }
  }

  /* ---------- סימוני סטטוס ---------- */
  var toastTmr;
  function toast(text, bad){
    var el = $("toast");
    el.textContent = text;
    el.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTmr);
    toastTmr = setTimeout(function(){ el.className = "toast"; }, bad ? 4000 : 1800);
  }

  function myToken(){ return (session.sets[session.meId] || {}).wt; }

  function cacheMarks(){
    try { localStorage.setItem(MARKS_CACHE, JSON.stringify(marks)); } catch (_){}
  }
  function loadCachedMarks(){
    try { marks = JSON.parse(localStorage.getItem(MARKS_CACHE) || "{}") || {}; } catch (_){ marks = {}; }
  }

  async function pullMarks(){
    var t = myToken();
    if (!t) return;
    try {
      var r = await fetch(API + "?t=" + encodeURIComponent(t), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      var d = await r.json();
      marks = {};
      (d.updates || []).forEach(function(u){ marks[u.taskId] = u; });
      clearedAt = d.clearedAt || 0;
      history = d.history || [];
      statusOn = true;
      cacheMarks();
      renderAll();
    } catch (err){
      statusOn = false;   // אין צד שרת — מסתירים את הסימונים במקום להציג כפתור שנכשל
      renderAll();
    }
  }

  async function setStatus(taskId, status, note, addr, btn){
    var before = marks[taskId];
    if (status === null) delete marks[taskId];
    else marks[taskId] = { status: status, note: note || "", byName: labelOf(session.meId),
                           byId: session.meId, at: Date.now(), addr: addr };
    cacheMarks();
    renderAll();
    if (btn) btn.classList.add("saving");

    try {
      var r = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: myToken(), taskId: taskId, status: status, note: note || "", addr: addr }),
      });
      if (!r.ok) throw new Error(r.status);
      toast(status === null ? "הסימון בוטל" : "נשמר · " + status);
    } catch (err){
      if (before) marks[taskId] = before; else delete marks[taskId];
      cacheMarks();
      renderAll();
      toast("לא נשמר. בדקו חיבור ונסו שוב.", true);
    }
  }

  function closePop(){
    var open_ = document.querySelector(".sheet");
    if (open_) open_.remove();
    var bg = document.querySelector(".sheetbg");
    if (bg) bg.remove();
  }
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePop(); });

  // גיליון הסימון: חלון ממורכז במחשב, גיליון תחתון בטלפון. מחליף בחירה ואז שמירה,
  // כדי שאפשר יהיה לכתוב את ההערה לפני ששולחים — ולא אחרי שכבר נשמר.
  function openPicker(row, t, btn){
    closePop();
    var cur = marks[t.id];
    var picked = cur ? cur.status : null;

    var bg = document.createElement("div");
    bg.className = "sheetbg";
    bg.addEventListener("click", closePop);
    document.body.appendChild(bg);

    var pop = document.createElement("div");
    pop.className = "sheet";
    pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-modal", "true");
    pop.innerHTML =
      "<h5>" + esc(t.addr) + "</h5>" +
      '<p class="sub">' + esc([t.city, t.type].filter(Boolean).join(" · ") || "סימון המשימה") + "</p>" +
      '<div class="picks">' +
        '<button type="button" class="w" aria-pressed="false"><span class="bub">●</span>בטיפול</button>' +
        '<button type="button" class="d" aria-pressed="false"><span class="bub">✓</span>בוצע</button>' +
      "</div>" +
      (cur && cur.note
        ? '<div class="lastnote"><b>ההערה הקודמת · ' + esc(cur.byName || "") + "</b>" + esc(cur.note) + "</div>"
        : "") +
      '<label class="lbl" for="noteBox">הערה — תיכנס גם ל"סטטוס הפרויקט" במאנדיי</label>' +
      '<textarea id="noteBox" placeholder="מה קרה במשימה הזו?" maxlength="500"></textarea>' +
      '<div class="foot2">' +
        '<button type="button" class="save" disabled>שמירה</button>' +
        (cur ? '<button type="button" class="clear">בטל סימון</button>' : "") +
        '<button type="button" class="close">ביטול</button>' +
      "</div>";
    document.body.appendChild(pop);

    var ta = pop.querySelector("textarea");
    var save = pop.querySelector(".save");
    var wb = pop.querySelector(".w"), db = pop.querySelector(".d");

    function paintPicks(){
      wb.setAttribute("aria-pressed", String(picked === "בטיפול"));
      db.setAttribute("aria-pressed", String(picked === "בוצע"));
      save.disabled = !picked;
      save.textContent = picked ? "שמירה · " + picked : "שמירה";
    }
    wb.addEventListener("click", function(){ picked = "בטיפול"; paintPicks(); ta.focus(); });
    db.addEventListener("click", function(){ picked = "בוצע";   paintPicks(); ta.focus(); });
    save.addEventListener("click", function(){
      if (!picked) return;
      closePop();
      setStatus(t.id, picked, ta.value, t.addr, btn);
    });
    var cl = pop.querySelector(".clear");
    if (cl) cl.addEventListener("click", function(){ closePop(); setStatus(t.id, null, "", t.addr, btn); });
    pop.querySelector(".close").addEventListener("click", closePop);
    // Ctrl/Cmd+Enter שומר מתוך תיבת ההערה
    ta.addEventListener("keydown", function(e){
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") save.click();
    });

    paintPicks();
    if (!window.matchMedia("(max-width:700px)").matches) (picked ? ta : wb).focus();
  }

  /* ---------- תצוגה ---------- */
  function labelOf(id){ return (session.sets[id] || {}).name || "—"; }
  function visible(t){ return showFuture || !t.date || t.date <= TODAY; }
  function countVisible(id){ return (session.sets[id].tasks || []).filter(visible).length; }

  function ordOf(name){
    var c = DATA.types[name];                       // 0 הוא אינדקס תקין — אסור להסתמך על falsy
    return (c && typeof c.ord === "number") ? c.ord : 999;
  }

  function renderAll(){
    if (!session) return;
    var n = Object.keys(marks).filter(function(k){ return (marks[k].at || 0) > clearedAt; }).length;
    $("uBadge").textContent = n;
    $("toUpdates").hidden = !(session.isAdmin && statusOn && view === "tasks");
    $("toTasks").hidden   = (view !== "updates");
    if (view === "updates") renderUpdates(); else render();
  }

  function passesFilter(t){
    if (statusFilter === "all") return true;
    var m = marks[t.id];
    if (statusFilter === "open")    return !m;
    if (statusFilter === "working") return !!m && m.status === "בטיפול";
    if (statusFilter === "done")    return !!m && m.status === "בוצע";
    return true;
  }

  function buildFilters(all){
    var box = $("filters");
    if (!statusOn){ box.hidden = true; box.innerHTML = ""; return; }
    var counts = {
      all: all.length,
      open: all.filter(function(t){ return !marks[t.id]; }).length,
      working: all.filter(function(t){ return marks[t.id] && marks[t.id].status === "בטיפול"; }).length,
      done: all.filter(function(t){ return marks[t.id] && marks[t.id].status === "בוצע"; }).length,
    };
    if (!counts.working && !counts.done && statusFilter === "all"){ box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML = "";
    [["all","הכל"],["open","פתוחות"],["working","בטיפול"],["done","בוצעו"]].forEach(function(f){
      var b = document.createElement("button");
      b.type = "button"; b.className = "pill";
      b.setAttribute("aria-pressed", String(statusFilter === f[0]));
      b.innerHTML = f[1] + ' <span class="n">' + counts[f[0]] + "</span>";
      b.addEventListener("click", function(){ statusFilter = f[0]; renderAll(); });
      box.appendChild(b);
    });
  }

  function matches(t){
    if (!query) return true;
    return (t.name + " " + (t.desc || "") + " " + (t.notes || "") + " " + (t.pstatus || "") + " " + (t.type || ""))
             .toLowerCase().indexOf(query) >= 0;
  }

  function render(){
    var pool  = ((session.sets[active] || {}).tasks || []).filter(function(t){ return visible(t) && matches(t); });
    buildFilters(pool);
    var tasks = pool.filter(passesFilter);

    $("content").hidden = false;
    $("updatesView").hidden = true;
    $("toolbar").hidden = false;
    var mine = (active === session.meId);
    $("viewTitle").textContent = mine ? "המשימות שלי" : "משימות · " + labelOf(active);

    var vb = $("viewing");
    vb.hidden = mine;
    if (!mine){
      vb.innerHTML = "";
      vb.appendChild(document.createTextNode("אתה צופה במשימות של " + labelOf(active) + " — בתור מנהל."));
      var back = document.createElement("button");
      back.type = "button";
      back.textContent = "חזרה למשימות שלי";
      back.addEventListener("click", function(){ active = session.meId; renderAll(); });
      vb.appendChild(back);
    }

    if (session.isAdmin){
      var kids = $("adminbar").children;
      for (var i = 0; i < kids.length; i++){
        kids[i].setAttribute("aria-pressed", String(session.order[i] === active));
        kids[i].querySelector(".n").textContent = countVisible(session.order[i]);
      }
    }

    var done = pool.filter(function(t){ return marks[t.id] && marks[t.id].status === "בוצע"; }).length;
    var busy = pool.filter(function(t){ return marks[t.id] && marks[t.id].status === "בטיפול"; }).length;

    $("eyebrow").textContent = new Intl.DateTimeFormat("he-IL", {
      timeZone:"Asia/Jerusalem", weekday:"long", day:"numeric", month:"long" }).format(new Date());

    var chips = '<span class="stat">משימות <b>' + pool.length + "</b></span>";
    if (busy) chips += '<span class="stat work">בטיפול <b>' + busy + "</b></span>";
    if (done) chips += '<span class="stat done">בוצעו <b>' + done + "</b></span>";
    $("stats").innerHTML = chips;
    $("synced").textContent = "עודכן מהלוח: " + DATA.syncedAt;
    drawProgress(done, pool.length);

    var box = $("content");
    box.innerHTML = "";
    if (!tasks.length){
      box.innerHTML = query
        ? '<div class="empty"><strong>אין תוצאות לחיפוש</strong>נסו ניסוח אחר.</div>'
        : '<div class="empty"><span class="big">✓</span><strong>הכל נקי</strong>אין משימות פתוחות עד היום.</div>';
      paintPane();
      return;
    }

    var keys = [], buckets = {};
    tasks.forEach(function(t){
      var k = (sortMode === "type") ? (t.type || NO_TYPE) : t.group;
      if (!buckets[k]){ buckets[k] = []; keys.push(k); }
      buckets[k].push(t);
    });
    if (sortMode === "type"){
      keys.sort(function(a, b){ return ordOf(a) - ordOf(b); });
    }

    keys.forEach(function(k){
      var c = ((sortMode === "type") ? DATA.types[k] : DATA.groupColors[k]) || GREY;
      var sec = document.createElement("section");
      sec.className = "group";
      sec.style.setProperty("--gc",   c.bg);
      sec.style.setProperty("--gc-l", c.light);
      sec.style.setProperty("--gc-d", c.dark);
      sec.innerHTML = '<div class="ghead"><span class="dot"></span><span class="gname">' +
                      esc(k) + '</span> <span class="gn">' + buckets[k].length + "</span></div>";
      var rows = document.createElement("div");
      rows.className = "rows";
      buckets[k].forEach(function(t){ addRow(rows, t); });
      sec.appendChild(rows);
      box.appendChild(sec);
    });
    paintPane();
  }

  async function clearUpdates(){
    try {
      var r = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ t: myToken(), clear: true }),
      });
      if (!r.ok) throw new Error(r.status);
      var d = await r.json();
      clearedAt = d.clearedAt || Date.now();
      toast("נוקה");
      renderAll();

      toast("הניקוי נכשל. נסו שוב.", true);

  function dayLabel(ts){
    var f = new Intl.DateTimeFormat("he-IL", { timeZone:"Asia/Jerusalem", weekday:"long", day:"numeric", month:"numeric" });
    return f.format(new Date(ts));
  }
  function timeLabel(ts){
    return new Intl.DateTimeFormat("he-IL", { timeZone:"Asia/Jerusalem", hour:"2-digit", minute:"2-digit" }).format(new Date(ts));
  }

  function renderUpdates(){
    var isHistory = updatesSub === "history";

    $("content").hidden = true;

      ? history.slice()

      if (!isHistory && list.length){

        : "<strong>אין עדכונים חדשים</strong>כשמישהו יסמן משימה כבטיפול או כבוצע, היא תופיע כאן.";

    var wrap = document.createElement("div");

        var h = document.createElement("div");

        h.textContent = day;
        wrap.appendChild(h);
      }
      var who = u.byName || "—";
      var bg = u.status === "בוצע" ? "#00c875" : "#fdab3d";
      var el = document.createElement("div");
      el.className = "uitem";
      el.innerHTML =
        '<span class="uava">' + esc(who.slice(0, 1)) + "</span>" +
        '<div class="ubody">' +
          '<div class="uhead">' +
            '<span class="uaddr">' + esc(u.addr || u.taskId) + "</span>" +
            '<span class="chip" style="background:' + bg + ';color:#1d2129">' + esc(u.status) + "</span>" +
            '<span class="utime">' + esc(who) + " · " + timeLabel(u.at) + "</span>" +
          "</div>" +
          (u.note ? '<div class="unote">' + esc(u.note) + "</div>" : "") +
        "</div>";
      wrap.appendChild(el);
    });
    box.appendChild(wrap);
    paintPane();
  }

  function drawProgress(done, total){
    var pctEl = $("pct"), trackEl = $("track");
    if (!statusOn || !total || !done){ pctEl.hidden = true; trackEl.hidden = true; return; }
    var pct = Math.round((done / total) * 100);
    pctEl.hidden = false; trackEl.hidden = false;
    pctEl.querySelector("b").textContent = pct + "%";
    trackEl.querySelector("i").style.width = pct + "%";
    trackEl.title = done + " מתוך " + total + " סומנו כבוצעו";
  }

  /* ---------- פירוט המשימה ---------- */
  var PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

  function phonesIn(s){
    var found = String(s || "").match(RE_PHONE) || [];
    var seen = {}, out = [];
    found.forEach(function(p){
      var k = p.replace(/\D/g, "");
      if (!seen[k]){ seen[k] = 1; out.push(p.trim()); }
    });
    return out;
  }
  function firstPhone(t){
    var p = phonesIn(t.notes);
    return p.length ? p[0] : (phonesIn(t.desc)[0] || null);
  }

  // "סטטוס הפרויקט" במאנדיי הוא יומן מתוארך (יום.חודש ואז הטקסט, בלוקים מופרדים
  // בשורה ריקה). מפרקים אותו לרשומות ומציגים כטיימליין, החדש למעלה.
  var RE_DATELINE = /^\s*(\d{1,2}\.\d{1,2}(?:\.\d{2,4})?)\s*$/;
  function timelineHTML(text){
    var blocks = String(text).split(/\n\s*\n+/).map(function(b){ return b.replace(/\s+$/, ""); })
                             .filter(function(b){ return b.trim(); });
    var items = blocks.map(function(b){
      var lines = b.split("\n");
      var m = lines[0].match(RE_DATELINE);
      if (m) return { date: m[1], body: lines.slice(1).join("\n").trim() };
      // שורה שמתחילה בתאריך ואחריו טקסט באותה שורה
      var inline = lines[0].match(/^\s*(\d{1,2}\.\d{1,2}(?:\.\d{2,4})?)\s+(.+)$/);
      if (inline) return { date: inline[1], body: [inline[2]].concat(lines.slice(1)).join("\n").trim() };
      return { date: "", body: b.trim() };
    }).filter(function(it){ return it.date || it.body; });

    if (!items.length) return "";
    items.reverse();                                  // החדש ביותר ראשון
    return '<ul class="tl">' + items.map(function(it, i){
      return '<li class="tl-item' + (i === 0 && it.date ? " newest" : "") + '">' +
               '<span class="tl-dot"></span>' +
               (it.date ? '<div class="tl-date">' + esc(it.date) + "</div>" : "") +
               '<div class="tl-body">' + richText(it.body) + "</div>" +
             "</li>";
    }).join("") + "</ul>";
  }

  function detailHTML(t){
    var html = "";
    if (t.desc) html += '<div class="dsec"><h4>המשימה</h4><p class="dtask">' + esc(t.desc) + "</p></div>";

    var tels = phonesIn(t.notes).concat(phonesIn(t.desc)).slice(0, 6);
    var seen = {};
    tels = tels.filter(function(p){ var k = p.replace(/\D/g,""); if (seen[k]) return false; seen[k] = 1; return true; });
    if (t.notes || tels.length){
      html += '<div class="dsec"><h4>אנשי קשר</h4>';
      if (tels.length){
        html += '<div class="tels">' + tels.map(function(p){
          return '<a class="telchip" href="tel:' + p.replace(/\D/g, "") + '">' + PHONE_ICON + "<span>" + esc(p) + "</span></a>";
        }).join("") + "</div>";
      }
      if (t.notes) html += '<p class="dbox">' + richText(t.notes) + "</p>";
      html += "</div>";
    }

    if (t.pstatus){
      var tl = timelineHTML(t.pstatus);
      html += '<div class="dsec"><h4>סטטוס הפרויקט</h4>' +
              (tl || '<p class="dbox">' + richText(t.pstatus) + "</p>") + "</div>";
    }
    return html;
  }

  function findTask(id){
    var sets = session ? session.sets : {};
    for (var k in sets){
      var list = sets[k].tasks || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    }
    return null;
  }

  // הפאנל הצדדי במחשב — מציג את המשימה שנבחרה, כדי לא לדחוף את הרשימה למטה
  function paintPane(){
    var pane = $("pane");
    if (!pane) return;
    pane.style.display = (view === "tasks") ? "" : "none";
    var t = openId ? findTask(openId) : null;
    if (!t || view !== "tasks"){
      pane.innerHTML = '<div class="pane-empty"><span class="ico">✦</span>בחרו משימה מהרשימה כדי לראות את הפרטים, אנשי הקשר והיומן שלה.</div>';
      return;
    }
    var mk = marks[t.id];
    var c = t.type ? DATA.types[t.type] : null;
    pane.innerHTML =
      '<div class="pane-head"><div>' +
        "<h3>" + esc(t.addr) + "</h3>" +
        '<p class="pane-city">' + esc([t.city, mk ? mk.status : ""].filter(Boolean).join(" · ")) + "</p>" +
      "</div>" +
      (t.type ? '<span class="chip"' + (c ? ' style="background:' + c.bg + ';color:' + c.fg + '"' : "") + ">" + esc(t.type) + "</span>" : "") +
      "</div>" + detailHTML(t);
  }

  function addRow(container, t){
    var mk = marks[t.id];
    var has = !!(t.desc || t.notes || t.pstatus);

    var row = document.createElement("div");
    row.className = "row" + (mk ? (mk.status === "בוצע" ? " is-done" : " is-work") : "") +
                    (openId === t.id ? " open" : "");
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-expanded", String(openId === t.id));

    // עיגול הסימון — הפעולה העיקרית, יעד מגע מלא
    var stb = document.createElement("button");
    stb.type = "button";
    stb.className = "st" + (mk ? (mk.status === "בוצע" ? " done" : " working") : "");
    stb.textContent = mk ? (mk.status === "בוצע" ? "✓" : "●") : "";
    stb.setAttribute("aria-label", mk ? "הסטטוס: " + mk.status : "סימון המשימה");
    stb.title = mk ? mk.status : "סימון כבטיפול או כבוצע";
    if (statusOn){
      stb.addEventListener("click", function(e){ e.stopPropagation(); openPicker(row, t, stb); });
      row.appendChild(stb);
    }

    var main = document.createElement("div");
    main.className = "rmain";

    // תאריך שכבר עבר פשוט נהיה משימה של היום, בלי ציון פיגור — משימות מסוימות
    // נמשכות זמן, וזה לא מידע שרלוונטי להציג בשורה. מוצג רק תאריך עתידי (תצוגת "כולל עתידיות").
    var dTxt = "";
    if (t.date){
      var d = delta(t.date);
      if (d > 0) dTxt = short(t.date);
    }

    var chip = "";
    if (t.type){
      var c = DATA.types[t.type];
      chip = c ? '<span class="chip" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(t.type) + "</span>"
               : '<span class="chip">' + esc(t.type) + "</span>";
    }

    var tel = firstPhone(t);
    main.innerHTML =
      '<div class="rline">' +
        '<span class="addr">' + esc(t.addr) + "</span>" +
        (t.city ? '<span class="city">' + esc(t.city) + "</span>" : "") +
        '<span class="rside">' + chip + (dTxt ? '<span class="date">' + esc(dTxt) + "</span>" : "") + "</span>" +
      "</div>" +
      (t.desc ? '<div class="rprev">' + esc(oneLine(t.desc)) + "</div>" : "");
    row.appendChild(main);

    // חיוג בנגיעה אחת — הפעולה הכי שכיחה בשטח, בלי להיכנס לפרטי המשימה
    if (tel){
      var call = document.createElement("a");
      call.className = "callbtn";
      call.href = "tel:" + tel.replace(/\D/g, "");
      call.title = "חיוג ל-" + tel;
      call.setAttribute("aria-label", "חיוג ל-" + tel);
      call.innerHTML = PHONE_ICON;
      call.addEventListener("click", function(e){ e.stopPropagation(); });
      row.appendChild(call);
    }

    var detail = document.createElement("div");
    detail.className = "detail";
    if (openId === t.id) detail.innerHTML = detailHTML(t);

    function toggle(){
      if (!has) return;
      var wasOpen = openId === t.id;
      openId = wasOpen ? null : t.id;
      // עדכון נקודתי בלי רינדור מחדש — כדי לא לאבד את מיקום הגלילה
      var all = document.querySelectorAll(".row.open");
      for (var i = 0; i < all.length; i++){
        all[i].classList.remove("open");
        all[i].setAttribute("aria-expanded", "false");
        if (all[i].nextElementSibling) all[i].nextElementSibling.innerHTML = "";
      }
      if (!wasOpen){
        row.classList.add("open");
        row.setAttribute("aria-expanded", "true");
        detail.innerHTML = detailHTML(t);
      }
      paintPane();
    }
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", function(e){
      if (e.target !== row) return;
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
    });

    container.appendChild(row);
    container.appendChild(detail);
  }

  /* ---------- פקדים ---------- */
  var tmr;
  $("search").addEventListener("input", function(e){
    clearTimeout(tmr);
    var v = e.target.value.trim().toLowerCase();
    tmr = setTimeout(function(){ query = v; renderAll(); }, 120);
  });
  function setSort(mode){
    sortMode = mode;
    $("sortBoard").setAttribute("aria-pressed", String(mode === "board"));
    $("sortType").setAttribute("aria-pressed",  String(mode === "type"));
    view = "tasks"; renderAll();
  }
  $("sortBoard").addEventListener("click", function(){ setSort("board"); });
  $("sortType").addEventListener("click",  function(){ setSort("type");  });
  $("future").addEventListener("change", function(e){ showFuture = e.target.checked; renderAll(); });
  $("toUpdates").addEventListener("click", function(){ view = "updates"; renderAll(); });
  $("toTasks").addEventListener("click",   function(){ view = "tasks";   renderAll(); });
  $("logout").addEventListener("click", function(){
    session = null; marks = {}; view = "tasks"; autoResumed = false; forget();
    clearedAt = 0; history = []; updatesSub = "active"; openId = null;
    $("resumed").hidden = true;
    $("viewing").hidden = true;
    $("adminbar").innerHTML = ""; $("adminbarWrap").hidden = true;
    $("futureWrap").hidden = true; $("future").checked = false; showFuture = false;
    $("toUpdates").hidden = true; $("toTasks").hidden = true;
    $("search").value = ""; query = ""; statusFilter = "all";
    $("filters").innerHTML = ""; $("filters").hidden = true;
    $("content").innerHTML = ""; $("updatesView").innerHTML = ""; $("pane").innerHTML = "";
    $("stats").innerHTML = ""; $("pct").hidden = true; $("track").hidden = true;
    try { localStorage.removeItem(MARKS_CACHE); } catch (_){}
    $("app").hidden = true; $("gate").hidden = false;
    $("pass").value = ""; $("gateMsg").textContent = "";
  });

  /* ---------- מצב כהה/בהיר ---------- */
  var THEME_KEY = "tb.theme";
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function sysDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function isDark(){
    var t = document.documentElement.getAttribute("data-theme");
    return t ? t === "dark" : sysDark();
  }
  function paintTheme(){ $("themeBtn").innerHTML = isDark() ? SUN : MOON; }
  try {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (_){}
  paintTheme();
  $("themeBtn").addEventListener("click", function(){
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (_){}
    paintTheme();
  });

  // גובה הסרגל הדביק משתנה (מנהל רואה שורת צוות נוספת, שורת הפילטרים מופיעה/נעלמת) —
  // כותרות הקבוצות והפאנל נעגנים אליו דינמית כדי שלא יתנגשו איתו בגלילה.
  var stickyEl = $("stickytop");
  function syncStickyH(){ document.documentElement.style.setProperty("--sticky-h", stickyEl.offsetHeight + "px"); }
  if (window.ResizeObserver) new ResizeObserver(syncStickyH).observe(stickyEl);
  else { window.addEventListener("resize", syncStickyH); syncStickyH(); }

  // צל עדין מתחת לסרגל רק אחרי שמתחילים לגלול
  addEventListener("scroll", function(){
    stickyEl.classList.toggle("scrolled", window.scrollY > 4);
  }, { passive: true });

  // קיצורי מקלדת במחשב: "/" לחיפוש, Esc לניקוי החיפוש
  addEventListener("keydown", function(e){
    if (e.key === "/" && document.activeElement !== $("search") &&
        !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "")){
      e.preventDefault(); $("search").focus(); $("search").select();
    } else if (e.key === "Escape" && document.activeElement === $("search") && $("search").value){
      $("search").value = ""; query = ""; renderAll();
    }
  });

  $("foot").textContent =
    "המשימות נשלפות מלוח המשימות במאנדיי. סימון \"בטיפול\"/\"בוצע\" והערה נשמרים כאן וגם נכתבים " +
    "חזרה למאנדיי. מוצגות משימות שתאריך הפולו־אפ שלהן הוא היום או קודם לכן.";

  resume();
})();
</script>
</body>
</html>
